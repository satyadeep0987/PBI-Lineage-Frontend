name: Frontend CD

on:
  workflow_run:
    workflows:
      - Frontend CI
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pbi-lineage-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Frontend

    if: >-
      vars.DEPLOYMENT_ENABLED == 'true' &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        )
      )

    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
      STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
      STORAGE_CONTAINER_NAME: ${{ vars.FRONTEND_CONTAINER_NAME }}

    steps:
      - name: Resolve release SHA
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi

          if [ -z "$SHA" ]; then
            echo "Unable to resolve release SHA."
            exit 1
          fi

          echo "RELEASE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Release SHA: $SHA"

      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Validate production artifact
        shell: bash
        run: |
          test -f build/client/index.html || {
            echo "index.html not found"
            exit 1
          }

          test -f build/client/web.config || {
            echo "web.config not found"
            exit 1
          }

          echo "Frontend artifact validation passed."

      - name: Create deployment ZIP
        shell: bash
        run: |
          ARTIFACT_NAME="frontend-${RELEASE_SHA}.zip"

          cd build/client
          zip -r "../../${ARTIFACT_NAME}" .
          cd ../..

          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"

          ls -lh "${ARTIFACT_NAME}"

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload frontend artifact
        shell: bash
        run: |
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT_NAME" \
            --container-name "$STORAGE_CONTAINER_NAME" \
            --name "$ARTIFACT_NAME" \
            --file "$ARTIFACT_NAME" \
            --auth-mode login \
            --overwrite true

      - name: Deploy frontend to Azure VM
        shell: bash
        run: |
          echo "Frontend VM deployment will be enabled"
          echo "after the Windows VM bootstrap and managed"
          echo "identity storage access are configured."

          echo "Artifact:"
          echo "$ARTIFACT_NAME"

          #
          # The final az vm run-command invocation
          # will be enabled during the VM bootstrap phase.
          #

      - name: Deployment summary
        shell: bash
        run: |
          echo "Frontend artifact prepared:"
          echo "$ARTIFACT_NAME"

          echo "Release:"
          echo "$RELEASE_SHA"